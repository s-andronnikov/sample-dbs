---
version: '3.7'

services:
  mssql_server:
    hostname: ${MSSQL_SERVER_HOST}
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SERVER_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - ${MSSQL_SERVER_PORT}:1433
    volumes:
      - mssql_server_data:/var/opt/mssql
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S ${MSSQL_SERVER_HOST} -U sa -P ${MSSQL_SERVER_SA_PASSWORD} -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  mssql_server.configurator:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - MSSQL_SERVER_HOST=${MSSQL_SERVER_HOST}
      - MSSQL_SERVER_SA_PASSWORD=${MSSQL_SERVER_SA_PASSWORD}
      - MSSQL_SERVER_USER=${MSSQL_SERVER_USER}
      - MSSQL_SERVER_PASSWORD=${MSSQL_SERVER_PASSWORD}
      - MSSQL_SERVER_DATABASE=${MSSQL_SERVER_DATABASE}
    volumes:
      - ./docker/mssql_server/initdb:/docker-entrypoint-initdb.d:ro
    depends_on:
      mssql_server:
        condition: service_healthy
    entrypoint:
      - docker-entrypoint-initdb.d/init_db.sh
#    command: >
#      bash -c '
#      /opt/mssql-tools/bin/sqlcmd -S ${MSSQL_SERVER_HOST} -U sa -P ${MSSQL_SERVER_SA_PASSWORD} -d master -i docker-entrypoint-initdb.d/init.sql;
#      /opt/mssql-tools/bin/sqlcmd -S ${MSSQL_SERVER_HOST} -U sa -P ${MSSQL_SERVER_SA_PASSWORD} -d master -i docker-entrypoint-initdb.d/sample_data.sql;
#      echo "All done!";
#      '

# https://hub.docker.com/r/gvenzl/oracle-free
  oracle_server:
    hostname: ${ORACLE_SERVER_HOST}
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      - ORACLE_PASSWORD=${MSSQL_SERVER_SA_PASSWORD}
      - APP_USER=${ORACLE_SERVER_USER}
      - APP_USER_PASSWORD=${ORACLE_SERVER_PASSWORD}
      - ORACLE_DATABASE=${ORACLE_SERVER_DATABASE}
    ports:
      - ${ORACLE_SERVER_PORT}:1521
    volumes:
      - oracle_server_data:/opt/oracle/oradata
      - ./docker/oracle_server/initdb:/container-entrypoint-initdb.d:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 5s